name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Monday 07:00 Europe/Moscow

permissions:
  contents: read

jobs:
  nuget:
    name: NuGet full audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Audit report parser tests
        shell: pwsh
        run: ./tests/DependencyAudit.Tests.ps1
      - name: Audit direct and transitive NuGet dependencies
        shell: pwsh
        run: ./scripts/check-dependencies.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/security/nuget-audit.json
          if-no-files-found: warn
          retention-days: 14
